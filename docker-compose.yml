services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mineguard-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mineguard-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped